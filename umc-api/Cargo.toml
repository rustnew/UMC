[package]
name = "umc-api"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "umc-api"
path = "src/main.rs"

[dependencies]
# ── Framework Web ───────────────────────────────────────────────────────────
actix-web        = "4.9"
actix-multipart  = "0.7"
actix-cors       = "0.7"
actix-files      = "0.6"

# ── Async ───────────────────────────────────────────────────────────────────
tokio            = { version = "1.40", features = ["full"] }
tokio-stream     = { version = "0.1", features = ["sync"] }
futures-util     = "0.3"

# ── Base de données ─────────────────────────────────────────────────────────
sqlx             = { version = "0.8", features = [
    "runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate",
]}

# ── Sérialisation ───────────────────────────────────────────────────────────
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"

# ── Auth & Crypto ────────────────────────────────────────────────────────────
jsonwebtoken     = "9.3"
argon2           = "0.5"
sha2             = "0.10"
rand             = "0.8"
hex              = "0.4"
base64           = "0.22"

# ── Identifiants & Temps ─────────────────────────────────────────────────────
uuid             = { version = "1.10", features = ["v4", "serde"] }
chrono           = { version = "0.4", features = ["serde"] }

# ── Logging ─────────────────────────────────────────────────────────────────
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ── Stockage ─────────────────────────────────────────────────────────────────
bytes            = "1.7"
mime             = "0.3"
tempfile         = "3.13"

# ── Erreurs & Config ─────────────────────────────────────────────────────────
thiserror        = "1.0"
anyhow           = "1.0"
dotenvy          = "0.15"
once_cell        = "1.20"
xxhash-rust      = { version = "0.8", features = ["xxh64"] }
num_cpus         = "1.16"

# ── UMC Core ─────────────────────────────────────────────────────────────────
umc-core         = { path = "../crates/umc-core" }
umc-pipeline     = { path = "../crates/umc-pipeline" }
umc-detect       = { path = "../crates/umc-detect" }
umc-graph        = { path = "../crates/umc-graph" }
umc-formats      = { path = "../crates/umc-formats" }
umc-validate     = { path = "../crates/umc-validate" }

[dev-dependencies]
actix-rt         = "2.10"
