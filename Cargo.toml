[workspace]
members = [
    "crates/umc-core",
    "crates/umc-detect",
    "crates/umc-graph",
    "crates/umc-pipeline",
    "crates/umc-validate",
    "crates/umc-formats",
    "crates/umc-cli",
    "crates/umc-tests",
    "umc-api",
    "umc-desktop",
]
resolver = "2"

[workspace.dependencies]
# Serialization
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"

# Parallelism
rayon            = "1.10"
crossbeam        = "0.8"
tokio            = { version = "1.40", features = ["full"] }
num_cpus         = "1.16"

# Memory & I/O
memmap2          = "0.9"
indexmap         = { version = "2.4", features = ["serde"] }

# Hashing & cryptography
xxhash-rust      = { version = "0.8", features = ["xxh64"] }
sha2             = "0.11"
hex              = "0.4"

# CLI
clap             = { version = "4.5", features = ["derive"] }

# Graph
petgraph         = "0.6"

# Protobuf (ONNX)
prost            = "0.13"

# ZIP (PyTorch)
zip              = { version = "2.1", default-features = false, features = ["deflate"] }

# Logging & errors
thiserror        = "1.0"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tests
tempfile         = "3.13"

[profile.release]
opt-level        = 3
lto              = "thin"
codegen-units    = 4
strip            = false
panic            = "unwind"

[profile.dev]
opt-level        = 0
debug            = true

[profile.bench]
opt-level        = 3
lto              = "thin"
