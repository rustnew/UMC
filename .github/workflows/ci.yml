name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-build-test:
    name: Rust (build + test + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Lint (clippy)
        # NOTE: legacy clippy debt is tracked as warnings (not `-D warnings`) so
        # the build stays green. Pay down debt incrementally and re-enable
        # `-D warnings` once the workspace is warning-free.
        run: cargo clippy --workspace --all-targets

      - name: Format check
        run: cargo fmt --check

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: umc-frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: umc-frontend
        run: bun run build